services:
  mmbcd-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmbcd_enterprise_service:latest
    container_name: mmbcd_inference_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_SECRET_KEY=production-enterprise-healthcare-mammography-secret-token
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount model weights directory (avoids baking multi-GB weights into images)
      - ./weights:/app/weights
      # Mount DICOM test samples
      - ./test_samples:/app/test_samples
      # Mount persistent runtime logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
